info:
  name: Lista Muestras
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}Laboratorio/muestras?FechaInicio={{FechaInicio}}&fechaFin={{fechaFin}}"
  params:
    - name: FechaInicio
      value: "{{FechaInicio}}"
      type: query
    - name: fechaFin
      value: "{{fechaFin}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
